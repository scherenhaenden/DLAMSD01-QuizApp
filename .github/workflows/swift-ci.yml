name: Swift CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Build Core
        run: swift build -v

      - name: Run Test Suite
        run: swift test -v --enable-code-coverage

      - name: Build iOS Simulator Target
        run: |
          xcodebuild -project TrainYourBrain.xcodeproj \
            -scheme TrainYourBrain \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS UI acceptance tests
        run: |
          xcodebuild -project TrainYourBrain.xcodeproj \
            -scheme TrainYourBrain \
            -destination "platform=iOS Simulator,name=iPad (9th generation)" \
            CODE_SIGNING_ALLOWED=NO \
            test
